<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Then &amp; There</title>
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="64x64" href="/favicon-64.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="stylesheet" href="/css/tokens.css" />
    <link rel="stylesheet" href="/css/primitives.css" />
    <link rel="stylesheet" href="/css/share.css" />
  </head>
  <body class="share">
    <header class="share-header">
      <a class="share-home" href="/" title="Open the editor">
        <span class="wordmark">Then <span class="wordmark-amp">&amp;</span> There</span>
      </a>
      <div class="share-actions">
        <button type="button" class="btn" id="downloadButton" disabled>
          Download
        </button>
      </div>
    </header>

    <main class="share-view">
      <div class="share-stage" id="stage" hidden>
        <canvas
          id="hudCanvas"
          aria-label="Saved photo with the HUD it was shared with"
        ></canvas>
      </div>
      <p class="share-status" id="status" role="status" aria-live="polite">
        Loading...
      </p>
    </main>

    <script type="module" src="/js/share.js"></script>
  </body>
</html>
