<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Then &amp; There</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;500&family=Geist:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <div class="app" id="app">
      <header class="topbar">
        <span class="wordmark">Then <span class="wordmark-amp">&amp;</span> There</span>
        <div class="topbar-actions">
          <button type="button" class="btn" id="pickButton">Add photo</button>
          <button type="button" class="btn btn-primary" id="shareButton" disabled>
            Share
          </button>
        </div>
      </header>

      <div class="layout">
        <aside class="sidebar">
          <div class="sidebar-scroll">
            <section class="group" aria-labelledby="source-label">
              <h2 class="group-label" id="source-label">Source</h2>
              <div class="group-rows" id="group-source"></div>
            </section>
            <section class="group" aria-labelledby="derived-label">
              <h2 class="group-label" id="derived-label">Derived</h2>
              <div class="group-rows" id="group-derived"></div>
            </section>
            <section class="group" aria-labelledby="style-label">
              <h2 class="group-label" id="style-label">Style</h2>
              <div class="group-rows" id="group-style"></div>
            </section>
          </div>

          <footer class="sidebar-footer" aria-labelledby="recent-label">
            <h2 class="group-label" id="recent-label">Recent</h2>
            <ul class="recent" id="recentList"></ul>
            <p class="recent-empty" id="recentEmpty">saved photos appear here</p>
          </footer>
        </aside>

        <main class="stage-wrap">
          <div class="stage" id="stage">
            <canvas
              id="hudCanvas"
              tabindex="0"
              aria-label="Photo preview with the HUD plate. Drag the plate with the pointer, or use the arrow keys to nudge it."
            ></canvas>
            <div class="stage-empty" id="stageEmpty">
              <p class="empty-title">Drop a photo</p>
              <p class="empty-hint">JPEG or PNG with EXIF, up to 15 MB</p>
              <button type="button" class="btn btn-primary" id="emptyPick">
                Choose a file
              </button>
            </div>
            <div class="drop-hint" id="dropHint">Drop to inspect</div>
          </div>
        </main>
      </div>

      <div class="popover" id="sharePopover" hidden>
        <p class="popover-title">Share link</p>
        <div class="popover-row">
          <input type="text" class="popover-url" id="shareUrl" readonly />
          <button type="button" class="btn" id="copyButton">Copy</button>
        </div>
        <a
          class="popover-open"
          id="openLink"
          target="_blank"
          rel="noopener"
        >Open in a new tab</a>
      </div>

      <input type="file" id="fileInput" accept="image/jpeg,image/png" hidden />
    </div>

    <script type="module" src="/js/editor.js"></script>
  </body>
</html>
