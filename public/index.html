<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Then &amp; There</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body class="editor-page">
    <header class="topbar">
      <div class="brand">
        <span class="brand-name">Then &amp; There</span>
        <span class="brand-version">v0.1</span>
      </div>
      <div class="actions">
        <button type="button" id="openButton" class="button">Open photo</button>
        <button type="button" id="shareButton" class="button button--accent" disabled>
          Share
        </button>
      </div>
      <input type="file" id="fileInput" accept="image/jpeg,image/png" hidden />
    </header>

    <div class="workspace">
      <aside class="sidebar" id="sidebar" aria-label="Photo fields">
        <div class="sidebar-scroll">
          <section class="group" aria-labelledby="sourceHeading">
            <h2 class="group-title" id="sourceHeading">Source</h2>
            <div class="group-body" id="sourceBody"></div>
          </section>

          <section class="group" aria-labelledby="derivedHeading">
            <h2 class="group-title" id="derivedHeading">Derived</h2>
            <div class="group-body" id="derivedBody"></div>
          </section>

          <section class="group" aria-labelledby="styleHeading">
            <h2 class="group-title" id="styleHeading">Style</h2>
            <div class="group-body" id="styleBody"></div>
          </section>
        </div>
      </aside>

      <section class="canvas-area" id="canvasArea">
        <canvas id="canvas" aria-label="Photo preview"></canvas>
        <div class="empty" id="emptyState">
          <p class="empty-title">No photo loaded</p>
          <p class="empty-hint">
            Drop a JPEG or PNG anywhere, or choose one to read its EXIF.
          </p>
          <button type="button" id="pickButton" class="button">Choose a file</button>
        </div>
      </section>
    </div>

    <div class="popover" id="sharePopover" hidden>
      <p class="popover-title">Share link</p>
      <div class="popover-url-row">
        <input type="text" id="shareUrl" class="popover-url" readonly />
        <button type="button" id="copyButton" class="button button--small">Copy</button>
      </div>
      <a id="openLink" class="popover-link" target="_blank" rel="noopener">
        Open in a new tab
      </a>
    </div>

    <div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

    <script type="module" src="/js/editor.js"></script>
  </body>
</html>
