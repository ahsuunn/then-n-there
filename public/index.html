<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Then &amp; There</title>
    <link rel="stylesheet" href="/css/app.css" />
  </head>
  <body>
    <header class="site-header">
      <h1>Then &amp; There</h1>
      <p class="tagline">Upload a photo. Get a share link.</p>
    </header>

    <main class="editor">
      <section
        class="drop-zone"
        id="dropZone"
        tabindex="0"
        role="button"
        aria-label="Upload a photo"
      >
        <input type="file" id="fileInput" accept="image/jpeg,image/png" hidden />
        <p class="drop-title">Drop a photo here</p>
        <p class="drop-hint">JPEG or PNG, up to 15 MB</p>
        <button type="button" class="pick-button" id="pickButton">
          Choose a file
        </button>
      </section>

      <p class="status" id="status" role="status" aria-live="polite"></p>

      <section class="result" id="result" hidden>
        <h2>Share link</h2>
        <div class="result-url-wrap">
          <input type="text" id="shareUrl" class="result-url" readonly />
          <button type="button" id="copyButton" class="copy-button">Copy</button>
        </div>
        <p>
          <a id="openLink" class="open-link" target="_blank" rel="noopener">
            Open in a new tab
          </a>
        </p>
      </section>
    </main>

    <script type="module" src="/js/main.js"></script>
  </body>
</html>
